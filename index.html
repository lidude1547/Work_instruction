<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奈米建築學 Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #020308; --panel: rgba(8, 12, 22, 0.82); --line: rgba(234, 246, 255, 0.14);
    --ink: #eaf6ff; --muted: #8ea3ba; --accent: #38e8ff; --accent-2: #a46bff;
  }
  /* 播放器本身固定深色，亮色系統主題下維持相同配色 */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #020308; } }
  :root[data-theme="dark"] { --bg: #020308; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  #player { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; background: var(--bg); user-select: none; }
  #stage { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #04060c; cursor: pointer; }
  #player.playing:not(.show-ui) { cursor: none; }
  #player.playing:not(.show-ui) #stage { cursor: none; }

  /* 控制列 */
  .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 12px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.85)); opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; }
  #player.show-ui .controls, #player:not(.playing) .controls { opacity: 1; transform: none; pointer-events: auto; }
  .bar { position: relative; height: 22px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .bar .track { position: absolute; left: 0; right: 0; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); transition: height .15s; }
  .bar:hover .track { height: 8px; }
  #bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  #bar-ticks i { position: absolute; top: -3px; width: 2px; height: calc(100% + 6px); background: rgba(255, 255, 255, 0.55); }
  #bar-head { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translateX(-50%); box-shadow: 0 0 12px var(--accent); }
  #bar-tip { position: absolute; bottom: 26px; transform: translateX(-50%); white-space: nowrap; font: 500 12px "JetBrains Mono", monospace; background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .bar:hover #bar-tip { opacity: 1; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .row .grow { flex: 1; }
  .btn { position: relative; height: 38px; min-width: 38px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink); font: 600 14px "Noto Sans TC", sans-serif; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn:hover { background: rgba(255, 255, 255, 0.08); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .btn.toggle { border-color: var(--line); color: var(--muted); }
  .btn.toggle.on { color: #031018; background: var(--accent); border-color: var(--accent); }
  .i-pause, #player.playing .i-play { display: none; }
  #player.playing .i-pause { display: block; }
  #time { font: 500 14px "JetBrains Mono", monospace; color: var(--muted); padding: 0 8px; }
  .menu { position: absolute; bottom: 46px; right: 0; min-width: 150px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: none; z-index: 5; }
  .menu.open { display: block; }
  .menu button { display: flex; width: 100%; justify-content: space-between; gap: 14px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font: 500 14px "Noto Sans TC", sans-serif; cursor: pointer; text-align: left; }
  .menu button:hover { background: rgba(255, 255, 255, 0.08); }
  .menu button.on { color: var(--accent); }
  .menu .head { font: 600 11px "JetBrains Mono", monospace; letter-spacing: .15em; color: var(--muted); padding: 6px 10px 4px; }
  #chap-menu { min-width: 250px; max-height: 60vh; overflow: auto; left: auto; }
  .chap-item span { font-family: "JetBrains Mono", monospace; color: var(--accent); margin-right: 10px; }
  .chap-item em { font-style: normal; color: var(--muted); font-family: "JetBrains Mono", monospace; margin-left: auto; }
  .wrap { position: relative; }

  /* 大播放鈕 */
  #big-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 104px; height: 104px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.7); background: rgba(4, 6, 12, 0.55); backdrop-filter: blur(6px); cursor: pointer; display: grid; place-items: center; transition: transform .2s, opacity .3s; box-shadow: 0 0 40px rgba(56, 232, 255, 0.35); }
  #big-play:hover { transform: translate(-50%, -50%) scale(1.06); }
  #big-play svg { width: 44px; height: 44px; fill: #fff; margin-left: 6px; }
  #player.playing #big-play { opacity: 0; pointer-events: none; }
  .hint { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); font: 500 13px "JetBrains Mono", monospace; color: var(--muted); letter-spacing: .1em; white-space: nowrap; transition: opacity .3s; }
  #player.playing .hint { opacity: 0; }

  #toast { position: absolute; top: 24px; left: 50%; transform: translate(-50%, -10px); background: var(--panel); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); font: 500 14px "JetBrains Mono", monospace; letter-spacing: .3em; color: var(--muted); transition: opacity .5s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  body.render .controls, body.render #big-play, body.render .hint, body.render #toast, body.render #loading { display: none !important; }
  body.render #stage { width: 1920px; height: 1080px; }

  @media (max-width: 640px) {
    .controls { padding: 28px 8px 8px; }
    .btn .lbl { display: none; }
    #time { font-size: 12px; padding: 0 4px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="player" class="show-ui">
  <canvas id="stage" aria-label="動態影像：奈米建築學 showreel"></canvas>
  <button id="big-play" aria-label="播放"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></button>
  <div class="hint">SPACE 播放 · C 字幕 · &lt; &gt; 變速 · ← → 跳轉</div>
  <div class="controls">
    <div class="bar" id="bar">
      <div class="track"><div id="bar-fill"></div><div id="bar-ticks"></div></div>
      <div id="bar-head"></div>
      <div id="bar-tip"></div>
    </div>
    <div class="row">
      <button class="btn" id="btn-play" aria-label="播放 / 暫停">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
      </button>
      <button class="btn toggle on" id="btn-mute" aria-label="聲音"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8a5 5 0 010 8M18.5 5.5a8.5 8.5 0 010 13" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>
      <span id="time">00:00 / 09:00</span>
      <span class="grow"></span>
      <div class="wrap">
        <button class="btn toggle" id="btn-chap" aria-label="章節"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg><span class="lbl">章節</span></button>
        <div class="menu" id="chap-menu"><div class="head">CHAPTERS</div></div>
      </div>
      <button class="btn toggle on" id="btn-cc" aria-pressed="true" aria-label="字幕開關"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v10h14V7zm2 3h4v1.5H8.5v1H11V14H7zm6 0h4v1.5h-2.5v1H17V14h-4z"/></svg><span class="lbl">字幕</span></button>
      <button class="btn toggle" id="btn-tts" aria-pressed="false" aria-label="AI 旁白"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3zm-6 8h2a4 4 0 008 0h2a6 6 0 01-5 5.9V20h-2v-3.1A6 6 0 016 11z"/></svg><span class="lbl">旁白</span></button>
      <div class="wrap">
        <button class="btn toggle on" id="btn-speed" aria-label="播放速度"><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 019 9h-2a7 7 0 10-14 0H3a9 9 0 019-9zm4.2 4.4l1.4 1.4-4.2 4.2a1.5 1.5 0 11-1.4-1.4z"/></svg><span id="speed-label">1×</span></button>
        <div class="menu" id="speed-menu">
          <div class="head">SPEED</div>
          <button data-v="0.5">0.5×<span>慢速研讀</span></button>
          <button data-v="0.75">0.75×</button>
          <button data-v="1">1×<span>標準</span></button>
          <button data-v="1.25">1.25×</button>
          <button data-v="1.5">1.5×</button>
          <button data-v="2">2×<span>快速瀏覽</span></button>
        </div>
      </div>
      <button class="btn" id="btn-fs" aria-label="全螢幕"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="loading">LOADING…</div>
</div>
<script src="app/data.js"></script>
<script src="app/glyphs.js"></script>
<script src="app/lib.js"></script>
<script src="app/scenes.js"></script>
<script src="app/scenes2.js"></script>
<script src="app/scenes3.js"></script>
<script src="app/player.js"></script>
</body>
</html>
